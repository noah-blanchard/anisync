<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <title>Hors connexion · AniSync</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 42%, rgba(91, 124, 250, 0.18), transparent 55%),
          #0b0c10;
        color: #f1f2f6;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 320px;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: #a3a7b5;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 14px;
        background: #7cc8ff;
        color: #0b1220;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7cc8ff" />
            <stop offset="1" stop-color="#5b7cfa" />
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="#12131a" />
        <path d="M18 38a14 14 0 0 1 24-14" fill="none" stroke="url(#a)" stroke-width="6" stroke-linecap="round" />
        <path d="M46 26a14 14 0 0 1-24 14" fill="none" stroke="#e8ecff" stroke-width="6" stroke-linecap="round" />
        <path d="M40 17l3 7.5-7.6 1.6" fill="none" stroke="url(#a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M24 47l-3-7.5 7.6-1.6" fill="none" stroke="#e8ecff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Hors connexion</h1>
      <p>AniSync a besoin d'internet pour parler à MyAnimeList et AniList. Reconnecte-toi puis réessaie.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
